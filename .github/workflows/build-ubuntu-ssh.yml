name: Build Ubuntu SSH image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release:
        description: Ubuntu 版本
        type: choice
        options:
          - noble
          - jammy
          - resolute
        default: noble
      release_tag:
        description: 发布 Release 使用的 tag（留空则自动生成，例如 noble-amd64-20261119-214500）
        type: string
        required: false
      net_tools:
        description: 网络工具（ping / dig / traceroute / tcpdump / nc / socat / mtr）
        type: boolean
        default: true
      editor_tools:
        description: 编辑与终端工具（vim / nano / tmux / htop / less）
        type: boolean
        default: true
      search_tools:
        description: 文本与 JSON 工具（ripgrep / jq / gawk / tree）
        type: boolean
        default: true
      archive_tools:
        description: 压缩与解压工具（xz / zstd / zip / unzip / bzip2）
        type: boolean
        default: true
      dev_tools:
        description: 开发工具（git / gcc / make / python3 / pip / gdb）
        type: boolean
        default: false
      debug_tools:
        description: 系统诊断工具（lsof / strace / sysstat / iotop）
        type: boolean
        default: false
      extra_packages:
        description: 额外 apt 包（逗号或空格分隔，可留空）
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: build-ubuntu-ssh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ github.event.inputs.release || 'noble' }}-amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    env:
      RELEASE: ${{ github.event.inputs.release || 'noble' }}
      NET_TOOLS: ${{ github.event.inputs.net_tools }}
      EDITOR_TOOLS: ${{ github.event.inputs.editor_tools }}
      SEARCH_TOOLS: ${{ github.event.inputs.search_tools }}
      ARCHIVE_TOOLS: ${{ github.event.inputs.archive_tools }}
      DEV_TOOLS: ${{ github.event.inputs.dev_tools }}
      DEBUG_TOOLS: ${{ github.event.inputs.debug_tools }}
      EXTRA_PACKAGES: ${{ github.event.inputs.extra_packages }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: meta
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${{ github.event.inputs.release_tag }}"
            if [ -z "${tag}" ]; then
              tag="${RELEASE}-amd64-$(date -u +%Y%m%d-%H%M%S)"
            fi
          fi

          case "${tag}" in
            ''|*[!A-Za-z0-9._-]*)
              echo "::error::Invalid release tag: ${tag}"
              exit 1
              ;;
          esac

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "Release tag: ${tag}"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install build dependencies
        run: |
          set -euo pipefail

          # Ubuntu archive mirrors occasionally return 503; retry a few times.
          for attempt in 1 2 3 4 5; do
            if sudo apt-get -o Acquire::Retries=5 update &&
               sudo apt-get -o Acquire::Retries=5 install -y \
                 debootstrap gpg python3-yaml rsync squashfs-tools zip; then
              exit 0
            fi

            echo "apt attempt ${attempt} failed, retrying in 15s..."
            sleep 15
          done

          echo "::error::Failed to install build dependencies after 5 attempts."
          exit 1

      - name: Assemble image definition
        run: |
          mkdir -p build
          python3 .github/scripts/assemble-image.py \
            doc/examples/ubuntu-ssh.yaml build/ubuntu-ssh.yaml

      - name: Build distrobuilder
        run: make

      - name: Validate definition
        run: |
          sudo env "PATH=${PATH}" "$(go env GOPATH)/bin/distrobuilder" validate \
            build/ubuntu-ssh.yaml

      - name: Build Incus image
        run: |
          set -uo pipefail

          # The Ubuntu archive occasionally times out or returns 503 while
          # debootstrap fetches the release files; retry the whole build.
          ok=0
          for attempt in 1 2 3; do
            echo "::group::Build attempt ${attempt}"
            if sudo env "PATH=${PATH}" "$(go env GOPATH)/bin/distrobuilder" build-incus \
                 build/ubuntu-ssh.yaml \
                 "${PWD}/out" \
                 --cache-dir "${RUNNER_TEMP}/distrobuilder" \
                 --keep-sources=false \
                 --timeout 7200; then
              ok=1
              echo "::endgroup::"
              break
            fi

            echo "::endgroup::"
            echo "Build attempt ${attempt} failed, retrying in 30s..."
            rm -rf out
            sleep 30
          done

          if [ "${ok}" -ne 1 ]; then
            echo "::error::Image build failed after 3 attempts."
            exit 1
          fi

          # distrobuilder runs as root, so hand the output back to the runner
          # user for the checksum and artifact steps.
          sudo chown -R "$(id -u):$(id -g)" "${PWD}/out"
          ls -lh out

      - name: Generate checksums
        run: |
          cd out
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS

      - name: Create release bundle
        run: |
          set -euo pipefail

          bundle="${RUNNER_TEMP}/bundle"
          rm -rf "${bundle}"
          mkdir -p "${bundle}"

          cp out/incus.tar.xz out/rootfs.squashfs out/SHA256SUMS "${bundle}/"
          cp build/ubuntu-ssh.yaml "${bundle}/ubuntu-ssh.yaml"

          cat > "${bundle}/README.txt" <<EOF
          Ubuntu ${RELEASE} amd64 Incus image

          Files:
            incus.tar.xz       Image metadata
            rootfs.squashfs    Root filesystem
            SHA256SUMS         Checksums
            ubuntu-ssh.yaml    Definition used for this build

          Import:
            incus image import incus.tar.xz rootfs.squashfs --alias ubuntu-ssh

          Launch and inject the container's SSH key:
            incus launch ubuntu-ssh mycontainer
            incus file push --create-dirs --mode 600 --uid 1000 --gid 1000 \\
              ~/.ssh/id_ed25519.pub mycontainer/home/ubuntu/.ssh/authorized_keys
            ssh ubuntu@<container-ip>

          No SSH key is baked into the image.
          EOF

          (cd "${bundle}" && zip -1 -r -q "${GITHUB_WORKSPACE}/out/ubuntu-ssh-${RELEASE}-amd64.zip" .)
          ls -lh "out/ubuntu-ssh-${RELEASE}-amd64.zip"

      - name: Write job summary
        run: |
          {
            echo "## Ubuntu ${RELEASE} (amd64) Incus image"
            echo
            echo "### 已选组件"
            echo
            echo "| 组件 | 是否安装 |"
            echo "| --- | --- |"
            echo "| 网络工具 | ${NET_TOOLS} |"
            echo "| 编辑与终端工具 | ${EDITOR_TOOLS} |"
            echo "| 文本与 JSON 工具 | ${SEARCH_TOOLS} |"
            echo "| 压缩与解压工具 | ${ARCHIVE_TOOLS} |"
            echo "| 开发工具 | ${DEV_TOOLS} |"
            echo "| 系统诊断工具 | ${DEBUG_TOOLS} |"
            echo "| 额外包 | ${EXTRA_PACKAGES:-（无）} |"
            echo
            echo "### 导入"
            echo
            echo '```bash'
            echo "incus image import incus.tar.xz rootfs.squashfs --alias ubuntu-ssh"
            echo '```'
            echo
            echo "### 创建容器并注入该容器的 SSH 公钥"
            echo
            echo '```bash'
            echo "incus launch ubuntu-ssh mycontainer"
            echo "incus file push --create-dirs --mode 600 --uid 1000 --gid 1000 \\"
            echo "  ~/.ssh/id_ed25519.pub mycontainer/home/ubuntu/.ssh/authorized_keys"
            echo "ssh ubuntu@<container-ip>"
            echo '```'
            echo
            echo "镜像中不含任何 SSH 公钥，每个容器在创建时注入自己的密钥。"
            echo
            echo "### 一键下载"
            echo
            echo "\`ubuntu-ssh-${RELEASE}-amd64.zip\`（包含下面全部文件）"
            echo
            echo "### 产物"
            echo
            echo '```'
            ls -lh out
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: incus-image-ubuntu-${{ env.RELEASE }}-amd64
          path: |
            out/*
            build/ubuntu-ssh.yaml
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail

          files=(
            "out/ubuntu-ssh-${RELEASE}-amd64.zip"
            out/incus.tar.xz
            out/rootfs.squashfs
            out/SHA256SUMS
            build/ubuntu-ssh.yaml
          )

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${files[@]}" --clobber
          else
            gh release create "${TAG}" "${files[@]}" \
              --target "${GITHUB_SHA}" \
              --title "Ubuntu ${RELEASE} amd64 (${TAG})" \
              --notes "Ubuntu ${RELEASE} amd64 Incus image.

          Selected components:
          - network tools: ${NET_TOOLS}
          - editor tools: ${EDITOR_TOOLS}
          - text/JSON tools: ${SEARCH_TOOLS}
          - archive tools: ${ARCHIVE_TOOLS}
          - dev tools: ${DEV_TOOLS}
          - debug tools: ${DEBUG_TOOLS}

          No SSH keys are baked into the image. Inject a key when creating the container:
          incus file push --create-dirs --mode 600 --uid 1000 --gid 1000 key.pub NAME/home/ubuntu/.ssh/authorized_keys

          Single download: ubuntu-ssh-${RELEASE}-amd64.zip"
          fi

          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          echo "### Release" >> "${GITHUB_STEP_SUMMARY}"
          echo >> "${GITHUB_STEP_SUMMARY}"
          echo "${url}" >> "${GITHUB_STEP_SUMMARY}"
          echo "Release published: ${url}"
