name: Build Ubuntu SSH image

on:
  workflow_dispatch:
    inputs:
      release:
        description: Ubuntu release to build
        type: choice
        options:
          - noble
          - jammy
          - resolute
        default: noble
      arch:
        description: Target architecture
        type: choice
        options:
          - amd64
          - arm64
        default: amd64
      ssh_public_key:
        description: SSH public key for the ubuntu user (falls back to the SSH_PUBLIC_KEY secret)
        type: string
        required: false
      ssh_users:
        description: |-
          Optional multi-user list, one "<username> <public key>" per line.
          A user may appear multiple times to add several keys.
          Falls back to the SSH_USERS secret.
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: build-ubuntu-ssh-${{ inputs.release }}-${{ inputs.arch }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ inputs.release }}-${{ inputs.arch }}
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 180

    env:
      INPUT_SSH_PUBLIC_KEY: ${{ inputs.ssh_public_key }}
      SECRET_SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
      INPUT_SSH_USERS: ${{ inputs.ssh_users }}
      SECRET_SSH_USERS: ${{ secrets.SSH_USERS }}
      RELEASE: ${{ inputs.release }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install build dependencies
        run: |
          set -euo pipefail

          # Ubuntu archive mirrors occasionally return 503; retry a few times.
          for attempt in 1 2 3 4 5; do
            if sudo apt-get -o Acquire::Retries=5 update &&
               sudo apt-get -o Acquire::Retries=5 install -y debootstrap gpg rsync squashfs-tools; then
              exit 0
            fi

            echo "apt attempt ${attempt} failed, retrying in 15s..."
            sleep 15
          done

          echo "::error::Failed to install build dependencies after 5 attempts."
          exit 1

      - name: Prepare SSH users
        run: |
          set -euo pipefail

          users="${INPUT_SSH_USERS:-${SECRET_SSH_USERS:-}}"

          if [ -z "${users}" ]; then
            key="${INPUT_SSH_PUBLIC_KEY:-${SECRET_SSH_PUBLIC_KEY:-}}"
            if [ -z "${key}" ]; then
              echo "::error::No SSH key provided. Set SSH_PUBLIC_KEY / SSH_USERS or pass ssh_public_key / ssh_users."
              exit 1
            fi

            users="ubuntu ${key}"
          fi

          install -d -m 0755 .ci
          printf '%s\n' "${users}" > .ci/ssh-users
          chmod 0644 .ci/ssh-users

          # Validate every non-empty, non-comment line.
          while IFS= read -r line || [ -n "${line}" ]; do
            case "${line}" in
              ''|\#*) continue ;;
            esac

            user="${line%% *}"
            key="${line#* }"

            if [ "${user}" = "${line}" ] || ! printf '%s' "${user}" | grep -Eq '^[a-z_][a-z0-9_-]*$'; then
              echo "::error::Invalid username in SSH users entry: ${line}"
              exit 1
            fi

            case "${key}" in
              ssh-*|ecdsa-*|sk-*) ;;
              *)
                echo "::error::Invalid SSH public key for user ${user}."
                exit 1
                ;;
            esac
          done < .ci/ssh-users

      - name: Build distrobuilder
        run: make

      - name: Validate definition
        run: |
          sudo env "PATH=${PATH}" "$(go env GOPATH)/bin/distrobuilder" validate \
            doc/examples/ubuntu-ssh.yaml \
            -o image.release="${RELEASE}"

      - name: Build Incus image
        run: |
          set -uo pipefail

          # The Ubuntu archive occasionally times out or returns 503 while
          # debootstrap fetches the release files; retry the whole build.
          ok=0
          for attempt in 1 2 3; do
            echo "::group::Build attempt ${attempt}"
            if sudo env "PATH=${PATH}" "$(go env GOPATH)/bin/distrobuilder" build-incus \
                 doc/examples/ubuntu-ssh.yaml \
                 "${PWD}/out" \
                 --cache-dir "${RUNNER_TEMP}/distrobuilder" \
                 --keep-sources=false \
                 --timeout 7200 \
                 -o image.release="${RELEASE}"; then
              ok=1
              echo "::endgroup::"
              break
            fi

            echo "::endgroup::"
            echo "Build attempt ${attempt} failed, retrying in 30s..."
            rm -rf out
            sleep 30
          done

          if [ "${ok}" -ne 1 ]; then
            echo "::error::Image build failed after 3 attempts."
            exit 1
          fi

          # distrobuilder runs as root, so hand the output back to the runner
          # user for the checksum and artifact steps.
          sudo chown -R "$(id -u):$(id -g)" "${PWD}/out"
          ls -lh out

      - name: Generate checksums
        run: |
          cd out
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS

      - name: Write job summary
        run: |
          {
            echo "## Ubuntu ${RELEASE} (${ARCH}) Incus image"
            echo
            echo "Built with the definition \`doc/examples/ubuntu-ssh.yaml\`."
            echo
            echo "### Use it"
            echo
            echo '```bash'
            echo "# Container image (split)"
            echo "incus image import incus.tar.xz rootfs.squashfs --alias ubuntu-ssh"
            echo "incus launch ubuntu-ssh mycontainer"
            echo
            echo "# SSH into it"
            echo "incus list mycontainer"
            echo "ssh ubuntu@<container-ip>"
            echo '```'
            echo
            echo "### Files"
            echo
            echo '```'
            ls -lh out
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
        env:
          ARCH: ${{ inputs.arch }}

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: incus-image-ubuntu-${{ inputs.release }}-${{ inputs.arch }}
          path: |
            out/*
            doc/examples/ubuntu-ssh.yaml
          if-no-files-found: error
          retention-days: 30
