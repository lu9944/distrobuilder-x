name: Build Ubuntu SSH image

on:
  workflow_dispatch:
    inputs:
      release:
        description: Ubuntu release to build
        type: choice
        options:
          - noble
          - jammy
          - resolute
        default: noble
      arch:
        description: Target architecture
        type: choice
        options:
          - amd64
          - arm64
        default: amd64
      ssh_public_key:
        description: SSH public key for the ubuntu user (falls back to the SSH_PUBLIC_KEY secret)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: build-ubuntu-ssh-${{ inputs.release }}-${{ inputs.arch }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ inputs.release }}-${{ inputs.arch }}
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 180

    env:
      INPUT_SSH_PUBLIC_KEY: ${{ inputs.ssh_public_key }}
      SECRET_SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
      RELEASE: ${{ inputs.release }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap gpg rsync squashfs-tools

      - name: Prepare authorized_keys
        run: |
          set -euo pipefail

          key="${INPUT_SSH_PUBLIC_KEY:-${SECRET_SSH_PUBLIC_KEY:-}}"
          if [ -z "${key}" ]; then
            echo "::error::No SSH public key provided. Set the SSH_PUBLIC_KEY repository secret or pass the ssh_public_key input."
            exit 1
          fi

          case "${key}" in
            ssh-*|ecdsa-*|sk-*) ;;
            *)
              echo "::error::The provided value does not look like an SSH public key."
              exit 1
              ;;
          esac

          install -d -m 0755 .ci
          printf '%s\n' "${key}" > .ci/authorized_keys
          chmod 0644 .ci/authorized_keys

      - name: Build distrobuilder
        run: make

      - name: Validate definition
        run: |
          sudo env "PATH=${PATH}" "$(go env GOPATH)/bin/distrobuilder" validate \
            doc/examples/ubuntu-ssh.yaml \
            -o image.release="${RELEASE}"

      - name: Build Incus image
        run: |
          sudo env "PATH=${PATH}" "$(go env GOPATH)/bin/distrobuilder" build-incus \
            doc/examples/ubuntu-ssh.yaml \
            "${PWD}/out" \
            --cache-dir "${RUNNER_TEMP}/distrobuilder" \
            --keep-sources=false \
            --timeout 7200 \
            -o image.release="${RELEASE}"

      - name: Generate checksums
        run: |
          cd out
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS

      - name: Write job summary
        run: |
          {
            echo "## Ubuntu ${RELEASE} (${ARCH}) Incus image"
            echo
            echo "Built with the definition \`doc/examples/ubuntu-ssh.yaml\`."
            echo
            echo "### Use it"
            echo
            echo '```bash'
            echo "# Container image (split)"
            echo "incus image import incus.tar.xz rootfs.squashfs --alias ubuntu-ssh"
            echo "incus launch ubuntu-ssh mycontainer"
            echo
            echo "# SSH into it"
            echo "incus list mycontainer"
            echo "ssh ubuntu@<container-ip>"
            echo '```'
            echo
            echo "### Files"
            echo
            echo '```'
            ls -lh out
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
        env:
          ARCH: ${{ inputs.arch }}

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: incus-image-ubuntu-${{ inputs.release }}-${{ inputs.arch }}
          path: |
            out/*
            doc/examples/ubuntu-ssh.yaml
          if-no-files-found: error
          retention-days: 30
